<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canada Through Time — Explorer (review build)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="explore.css">
</head>
<body>
<div id="app">
  <div id="plate">
    <div id="sky"></div>
    <div id="map" aria-label="3D map of Canada"></div>
    <div id="grat-labels"></div>
    <div id="plate-cap"></div>
  </div>

  <header id="folio"><span class="mark">Canada Through Time</span><span id="folio-r"></span></header>

  <nav id="layers" aria-label="Map layers"></nav>
  <div id="start" hidden></div>

  <section id="reading" aria-live="polite">
    <div id="r-group"></div>
    <h1 id="r-title"></h1>
    <div id="yearhero"></div>
    <p id="finding"></p>
    <p id="r-q"></p>
    <div id="r-meta"></div>
    <div id="legend"></div>
    <div id="pathcard"></div>
    <ol id="notes"></ol>
  </section>
  <button id="layer-btn" class="mobile-only" aria-haspopup="true">Layers</button>
  <div id="layer-sheet" class="mobile-only" role="dialog" aria-label="Map layers"></div>

  <div id="mapctl" role="toolbar" aria-label="Map controls">
    <button data-act="zin" aria-label="Zoom in">+</button>
    <button data-act="zout" aria-label="Zoom out">−</button>
    <button data-act="tilt" class="t3" aria-label="Toggle flat or tilted view">3D</button>
    <button data-act="reset" aria-label="Reset view">⌂</button>
    <button data-act="pal" class="palb" aria-label="Colours and map surface" aria-haspopup="true" aria-expanded="false"><i></i></button>
  </div>
  <div id="palpop" role="dialog" aria-label="Colours and map surface" hidden></div>
  <div id="grain" aria-hidden="true"></div>

  <aside id="sheet" aria-label="Place details">
    <div id="grip" class="mobile-only" aria-label="Drag to resize"></div>
    <div id="mtl" class="mobile-only"><button id="mplay" aria-label="Play">▶</button><div id="myear-l"></div><input id="myear" type="range" aria-label="Year"></div>
    <div id="mev" class="mobile-only"></div>
    <div id="sheet-body"></div>
  </aside>

  <footer id="timeline">
    <div id="tl-head">
      <button id="play" aria-label="Play">▶</button>
      <div id="tl-year"></div>
      <div id="tl-ctx"></div>
      <div id="tl-speed" aria-label="Speed"><button data-s="1.6">Slow</button><button data-s="0.8" class="on">Normal</button><button data-s="0.35">Fast</button></div>
    </div>
    <div id="tl-rail">
      <div id="tl-ev"></div>
      <input id="year" type="range" aria-label="Year">
      <div id="tl-ticks"></div>
      <div id="tl-era"></div>
    </div>
  </footer>

  <div id="tooltip" role="tooltip"></div>
  <dialog id="drawer"><div id="drawer-body"></div><form method="dialog"><button id="drawer-close">Close</button></form></dialog>
</div>
<script src="../vendor/deck.min.js"></script>
<script type="module" src="shell.js"></script>
<script type="module" src="explore.js"></script>
<script type="module" src="cities.js"></script>
<script type="module" src="climate.js"></script>
<script type="module" src="money.js"></script>
<script type="module" src="about.js"></script>
<script type="module" src="tour.js"></script>
</body>
</html>
