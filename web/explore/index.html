<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canada Through Time — Explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="explore.css">
</head>
<body class="theme-night palette-earth">
<div id="app">
  <div id="map" aria-label="3D map of Canada"></div>

  <header id="brand">
    <div class="kicker">Canada Through Time</div>
    <div class="brand-sub">Explorer <span class="beta">beta</span></div>
  </header>

  <nav id="layers" aria-label="What to show">
    <button id="layers-toggle" class="mobile-only" aria-expanded="false">Layer</button>
    <div id="layers-body"></div>
  </nav>

  <section id="headline" aria-live="polite">
    <div id="h-measure"></div>
    <div id="h-year"></div>
    <div id="h-note"></div>
  </section>

  <div id="legend"></div>

  <div id="mapctl" role="toolbar" aria-label="Map controls">
    <button data-act="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button data-act="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <button data-act="rotl" title="Rotate left" aria-label="Rotate left">↺</button>
    <button data-act="rotr" title="Rotate right" aria-label="Rotate right">↻</button>
    <button data-act="tilt" title="Tilt 2D / 3D" aria-label="Toggle tilt">3D</button>
    <button data-act="reset" title="Reset view" aria-label="Reset view">⌂</button>
  </div>

  <aside id="panel" aria-label="Place details">
    <div id="panel-grip" class="mobile-only"></div>
    <div id="panel-body"></div>
  </aside>

  <footer id="timeline">
    <div id="tl-top">
      <button id="play" aria-label="Play">▶</button>
      <div id="tl-year"></div>
      <div id="tl-speed"><button data-s="1.6">½×</button><button data-s="0.8" class="on">1×</button><button data-s="0.35">2×</button></div>
      <div id="tl-now"></div>
    </div>
    <div id="tl-track-wrap">
      <div id="tl-gov"></div>
      <div id="tl-marks"></div>
      <input id="year" type="range" min="1971" max="2026" step="1" value="2026" aria-label="Year">
      <div id="tl-ticks"></div>
    </div>
  </footer>

  <div id="tooltip" role="tooltip"></div>
  <dialog id="drawer"><div id="drawer-body"></div><form method="dialog"><button id="drawer-close" aria-label="Close">Close</button></form></dialog>
</div>
<script src="../vendor/deck.min.js"></script>
<script type="module" src="explore.js"></script>
</body>
</html>
