    licence: "Public domain"
    attribution: "Boundaries: Natural Earth (public domain)."
    quality_class: established_research
    limitations:
      - "Generalized cartographic boundaries (1:10m), current boundaries only. Suitable for national and provincial display, not for analysis or municipal scale. StatCan cartographic boundary files will replace these when municipal layers are added."

  statcan_17100008:
    title: "Estimates of the components of demographic growth, annual"
    publisher: "Statistics Canada"
    table_id: "17-10-0008-01"
    doi: "https://doi.org/10.25318/1710000801-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000801"
    download_url: "https://www150.statcan.gc.ca/n1/tbl/csv/17100008-eng.zip"
    raw_file: "data/raw/statcan/17100008-eng.zip"
    sha256: "85a3b6a331d4eecdc4d2bc3b2aa8a564a7ad0324dc3de23a832e23ad321e98e9"
    retrieved: "2026-11-11"
    reporting_period: "Annual, July 1 to June 30 (1971/1972 to 2025/2026)"
    geographic_coverage: "Canada, provinces and territories"
    units: "Persons"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 17-10-0008-01 Estimates of the components of demographic growth, annual."
    quality_class: official_statistics
    methodology_notes:
      - "NT and NU are separate from 1991/1992; before that only the combined figure exists (notes 2–3)."
      - "Births and deaths final to 2023/2024, updated 2024/2025, preliminary 2025/2026; other components have their own final/preliminary cut-offs (notes 4–14)."
      - "Net emigration = emigrants − returning emigrants; 1991 to June 2016 it also includes net temporary emigration. Emigration estimates were revised back to July 2016 with a different method (notes 21–22)."
      - "Non-permanent residents (work/study permit holders, asylum claimants and family) are StatCan estimates and differ from IRCC counts (notes 10, 19)."
      - "Residual deviation distributes the census error of closure across the intercensal period (note 12)."
    limitations:
      - "Components for the most recent years are preliminary and will be revised."

  statcan_17100045:
    title: "Estimates of interprovincial migrants by province or territory of origin and destination, quarterly"
    publisher: "Statistics Canada"
    table_id: "17-10-0045-01"
    doi: "https://doi.org/10.25318/1710004501-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710004501"
    download_url: "https://www150.statcan.gc.ca/n1/en/tbl/csv/17100045-eng.zip"
    raw_file: "data/raw/statcan/17100045-eng.zip"
    sha256: "38058dbf758082ef8c99b8af0dd6cd1dea62fbaa1b4432e90f02b1ef38f042ca"
    retrieved: "2026-11-11"
    reporting_period: "Quarterly, July 1971 to April 2026; summed here to July–June periods"
    geographic_coverage: "Province or territory of origin × destination"
    units: "Persons"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 17-10-0045-01 Estimates of interprovincial migrants by province or territory of origin and destination, quarterly."
    quality_class: official_statistics
    methodology_notes:
      - "Data source changes: Family Allowance (July 1971–June 1976), CRA tax data (July 1976–June 2025), Canada child benefit data (from July 2025) (note 3)."
      - "Quarterly in- and out-migrant counts before 2011 are not fully comparable with later ones; summed quarterly gross flows can exceed annual counts because people who move more than once in a year are counted each time. Net migration is additive (note 9)."
      - "Before July 1991 only NT and NU combined are available; 1976–1991 totals exclude moves between NT and NU (notes 5–6)."
      - "Final to June 2025, updated July 2025 to March 2026, preliminary from April 2026 (note 7)."
    limitations:
      - "Gross flows are sums of quarterly moves (a 'moves recorded' measure), not unique people per year."

