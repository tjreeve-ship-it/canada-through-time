# Source registry — every dataset the platform displays must have an entry here.
# Raw files are stored unmodified under data/raw/ and verified by SHA-256 on every pipeline run.
# quality_class: official_statistics | established_research | reconstructed_estimate | unverified

sources:
  statcan_17100009:
    title: "Population estimates, quarterly"
    publisher: "Statistics Canada"
    table_id: "17-10-0009-01"
    doi: "https://doi.org/10.25318/1710000901-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000901"
    download_url: "https://www150.statcan.gc.ca/n1/tbl/csv/17100009-eng.zip"
    survey: "Quarterly Demographic Estimates (survey 3601)"
    raw_file: "data/raw/statcan/17100009-eng.zip"
    sha256: "b50bf05150e42edf3771ceb1d6868581fb6747b5886e0d1450b8b3437958bd0b"
    retrieved: "2026-11-11"
    release_in_file: "Files dated 2026-09-23; covers 1946-01-01 to 2026-07-01"
    reporting_period: "Quarterly (Jan 1, Apr 1, Jul 1, Oct 1)"
    geographic_coverage: "Canada, 10 provinces, 3 territories"
    units: "Persons"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 17-10-0009-01 Population estimates, quarterly."
    quality_class: official_statistics
    methodology_notes:
      - "Estimates are final intercensal from July 1, 1971 to April 1, 2021; final postcensal July 1, 2021 to July 1, 2023; updated postcensal Oct 1, 2023 to Apr 1, 2026; preliminary postcensal from July 1, 2026 (StatCan table note 3)."
      - "Before July 1, 1971 estimates are unadjusted for census net undercoverage and rounded to the thousand. This platform starts population series at 1971-07-01 to avoid that methodological break."
      - "Northwest Territories and Nunavut are presented separately from July 1, 1991, on current boundaries, although Nunavut was legally created April 1, 1999 (table notes 4 and 5). Before July 1991 only the combined figure exists; the map shows the two territories as one combined region for those dates."
      - "Quarterly estimates reflect components of change from the preceding quarter (table note 2)."
    limitations:
      - "Estimates are revised as new census and component data arrive; preliminary values may change."

  naturalearth_admin1:
    title: "Admin 1 – States, Provinces (1:10m), plus lakes, countries, rivers (1:50m)"
    publisher: "Natural Earth"
    landing_url: "https://www.naturalearthdata.com/"
    download_url: "https://github.com/nvkelso/natural-earth-vector/tree/master/geojson"
    raw_files:
      - data/raw/naturalearth/ne_10m_admin_1_states_provinces.geojson
      - data/raw/naturalearth/ne_50m_admin_0_countries.geojson
      - data/raw/naturalearth/ne_50m_lakes.geojson
      - data/raw/naturalearth/ne_50m_rivers_lake_centerlines.geojson
    version: "5.2.0-pre (repository master)"
    retrieved: "2026-11-11"
    licence: "Public domain"
    attribution: "Boundaries: Natural Earth (public domain)."
    quality_class: established_research
    limitations:
      - "Generalized cartographic boundaries (1:10m), current boundaries only. Suitable for national and provincial display, not for analysis or municipal scale. StatCan cartographic boundary files will replace these when municipal layers are added."

  statcan_17100008:
    title: "Estimates of the components of demographic growth, annual"
    publisher: "Statistics Canada"
    table_id: "17-10-0008-01"
    doi: "https://doi.org/10.25318/1710000801-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000801"
    download_url: "https://www150.statcan.gc.ca/n1/tbl/csv/17100008-eng.zip"
    raw_file: "data/raw/statcan/17100008-eng.zip"
    sha256: "85a3b6a331d4eecdc4d2bc3b2aa8a564a7ad0324dc3de23a832e23ad321e98e9"
    retrieved: "2026-11-11"
    reporting_period: "Annual, July 1 to June 30 (1971/1972 to 2025/2026)"
    geographic_coverage: "Canada, provinces and territories"
    units: "Persons"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 17-10-0008-01 Estimates of the components of demographic growth, annual."
    quality_class: official_statistics
    methodology_notes:
      - "NT and NU are separate from 1991/1992; before that only the combined figure exists (notes 2–3)."
      - "Births and deaths final to 2023/2024, updated 2024/2025, preliminary 2025/2026; other components have their own final/preliminary cut-offs (notes 4–14)."
      - "Net emigration = emigrants − returning emigrants; 1991 to June 2016 it also includes net temporary emigration. Emigration estimates were revised back to July 2016 with a different method (notes 21–22)."
      - "Non-permanent residents (work/study permit holders, asylum claimants and family) are StatCan estimates and differ from IRCC counts (notes 10, 19)."
      - "Residual deviation distributes the census error of closure across the intercensal period (note 12)."
    limitations:
      - "Components for the most recent years are preliminary and will be revised."

  statcan_17100045:
    title: "Estimates of interprovincial migrants by province or territory of origin and destination, quarterly"
    publisher: "Statistics Canada"
    table_id: "17-10-0045-01"
    doi: "https://doi.org/10.25318/1710004501-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710004501"
    download_url: "https://www150.statcan.gc.ca/n1/en/tbl/csv/17100045-eng.zip"
    raw_file: "data/raw/statcan/17100045-eng.zip"
    sha256: "38058dbf758082ef8c99b8af0dd6cd1dea62fbaa1b4432e90f02b1ef38f042ca"
    retrieved: "2026-11-11"
    reporting_period: "Quarterly, July 1971 to April 2026; summed here to July–June periods"
    geographic_coverage: "Province or territory of origin × destination"
    units: "Persons"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 17-10-0045-01 Estimates of interprovincial migrants by province or territory of origin and destination, quarterly."
    quality_class: official_statistics
    methodology_notes:
      - "Data source changes: Family Allowance (July 1971–June 1976), CRA tax data (July 1976–June 2025), Canada child benefit data (from July 2025) (note 3)."
      - "Quarterly in- and out-migrant counts before 2011 are not fully comparable with later ones; summed quarterly gross flows can exceed annual counts because people who move more than once in a year are counted each time. Net migration is additive (note 9)."
      - "Before July 1991 only NT and NU combined are available; 1976–1991 totals exclude moves between NT and NU (notes 5–6)."
      - "Final to June 2025, updated July 2025 to March 2026, preliminary from April 2026 (note 7)."
    limitations:
      - "Gross flows are sums of quarterly moves (a 'moves recorded' measure), not unique people per year."

  statcan_98100001:
    title: "Population and dwelling counts: Canada, provinces and territories (2021 Census)"
    publisher: "Statistics Canada"
    table_id: "98-10-0001-01"
    doi: "https://doi.org/10.25318/9810000101-eng"
    landing_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810000101"
    download_url: "https://www150.statcan.gc.ca/n1/tbl/csv/98100001-eng.zip"
    raw_file: "data/raw/statcan/98100001-eng.zip"
    sha256: "7f75c9eb0e8b73ba8fcf0de2726a9eaf0cfb16ad56d57aa1cf49684bf0be806e"
    retrieved: "2026-11-11"
    reporting_period: "Census 2021"
    geographic_coverage: "Canada, provinces and territories"
    units: "km² (land area)"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 98-10-0001-01 Population and dwelling counts."
    quality_class: official_statistics
    methodology_notes:
      - "Density here = quarterly population estimate ÷ 2021 Census land area. Land area is held constant across years (a derived measure)."
    limitations:
      - "Land area changes little but is not constant across censuses; densities for early years use 2021 area."

  parlinfo_elected:
    title: "Elections and Elected Candidates (ParlInfo web service)"
    publisher: "Library of Parliament"
    landing_url: "https://lop.parl.ca/sites/ParlInfo/default/en_CA/ElectionsRidings/electionsElectedCandidates"
    download_url: "https://lop.parl.ca/ParlinfoWebApi/Parliament/GetElectedCandidates"
    raw_file: "data/raw/parlinfo/elected_candidates.xml"
    sha256: "4ceeaa20033047ca4bcf1d7c596e5c2be93ad89a5e472e994a0ca6f94a9596b5"
    retrieved: "2026-11-11"
    reporting_period: "Federal general elections (this platform uses 1972–2025)"
    geographic_coverage: "Electoral districts, aggregated to province or territory"
    units: "Seats won (elected candidates)"
    licence: "Library of Parliament terms of use; attribution required"
    attribution: "Source: Library of Parliament, ParlInfo, Elections and Elected Candidates."
    quality_class: official_statistics
    methodology_notes:
      - "Seats = count of candidates recorded as elected in each general election, by province and party, on election night (later floor crossings and by-elections are not reflected)."
      - "ParlInfo records 341 elected candidates for 2025-04-28 against 343 seats; the difference is shown, not filled."
    limitations:
      - "Seats are not votes; popular vote shares are a separate dataset (Elections Canada) still to be added."

  parlinfo_prime_ministers:
