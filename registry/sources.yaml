    sha256: "3d27f9cd171b182e7372667b48c1b3a7402dafbfe9582c4de42e3ef6f3cdd1f5"
    retrieved: "2026-11-11"
    release_in_file: "Released 2026-01-21; covers 1955–2025"
    reporting_period: "Annual (calendar year)"
    coverage: "Canada and 10 provinces. No territories in this table."
    units: "Dwelling units"
    licence: "CMHC Licence Agreement for the Use of Data (reuse permitted with accurate reproduction and clear acknowledgement; must not imply CMHC endorsement)"
    licence_url: "https://www.statcan.gc.ca/en/reference/agreement_CMHC"
    attribution: "Source: CMHC, Starts and Completions Survey, via Statistics Canada Table 34-10-0126-01."
    quality_class: official_statistics
    methodology_notes:
      - "Starts and Completions Survey: a start is the pouring of the footing; a completion is when 90% or more of the work is done (CMHC definitions)."
      - "'All areas' combines centres of 10,000+ (enumerated monthly) with smaller areas (estimated quarterly by sample)."
      - "Geographical areas are modified every 5 years to reflect census definitions, so data are not strictly comparable historically (table note)."
    limitations:
      - "Completions are new units only. They are not net additions to the housing stock: demolitions, conversions and units lost are not subtracted."
      - "No territorial data in this table."

