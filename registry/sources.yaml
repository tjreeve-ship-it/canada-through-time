    sha256: "add7aac4665b7a7a55a103f51d1a4d77a1b68cd9b8d1fddc60163718e2cddad5"
    retrieved: "2026-11-11"
    release_in_file: "File dated 2025-12-12; census years 2006, 2011 (NHS), 2016, 2021"
    reporting_period: "Census years only"
    coverage: "Canada, provinces and territories. This platform shows 2016 and 2021 only."
    units: "Percent of persons in private households examined for core housing need"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 39-10-0048-01. Census of Population 2016 and 2021."
    quality_class: official_statistics
    methodology_notes:
      - "Core housing need: a household's dwelling falls below at least one of the adequacy (no major repairs), affordability (shelter costs under 30% of before-tax income) or suitability (enough bedrooms) standards, and it would have to spend 30% or more of before-tax income to rent acceptable local housing at the median rent (Census definition)."
      - "Only private, non-farm, non-reserve households with income above zero and shelter-cost-to-income ratios under 100% are examined. Non-family student households with a maintainer aged 15 to 29 are counted as not in need."
      - "Counts are randomly rounded; percentages are computed by Statistics Canada."
      - "This table counts persons living in households in core housing need, not households."
    limitations:
      - "Census years only: no annual values exist between censuses, and none are estimated here."
      - "2021 Census income refers to 2020, when temporary pandemic income supports lowered the share of income spent on housing; Statistics Canada attributes much of the 2016→2021 decline to these supports (The Daily, 2023-01-23)."
      - "On-reserve households are not examined, which matters most where many people live on reserve."
      - "2011 values come from the voluntary National Household Survey and are not shown."

