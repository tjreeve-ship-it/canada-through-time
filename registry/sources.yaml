    sha256: "9b52900a2fc26b7e11ac22d819b3164678fe9a2a5ff241c5db085816a5fe8e0a"
    retrieved: "2026-11-11"
    release_in_file: "Released 2026-01-19; covers 1914–2025"
    reporting_period: "Annual average"
    coverage: "Canada (rent from 1949), provinces from 1979; territories only as cities (Whitehorse, Yellowknife, Iqaluit)"
    units: "Index, 2002=100"
    licence: "Statistics Canada Open Licence"
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    attribution: "Source: Statistics Canada. Table 18-10-0005-01 Consumer Price Index, annual average, not seasonally adjusted."
    quality_class: official_statistics
    methodology_notes:
      - "The CPI is a fixed-basket price index, not a cost-of-living index (table note)."
      - "The rent index measures rent paid by all tenants (new leases, renewals, mid-lease), not asking rents for vacant units."
      - "January 2019: the rent index moved from a matched-model to a hedonic method using Labour Force Survey rents (Prices Analytical Series 62F0014M2019002). Comparisons across 2019 mix methods."
    limitations:
      - "An index shows change from its base, not a level: provinces cannot be compared on rent levels using the CPI."

